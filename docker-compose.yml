version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: omraflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omraflow_dev
      POSTGRES_USER: omraflow
      POSTGRES_PASSWORD: omraflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omraflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: omraflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (optional - can run locally)
  # api:
  #   build:
  #     context: .
  #     dockerfile: ./docker/Dockerfile.api
  #   container_name: omraflow_api
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     NODE_ENV: development
  #     DATABASE_URL: postgresql://omraflow:omraflow@postgres:5432/omraflow_dev?schema=public
  #     REDIS_URL: redis://redis:6379
  #   volumes:
  #     - ./apps/api:/app/apps/api
  #     - ./packages:/app/packages
  #     - /app/node_modules
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   command: npm run dev --workspace=@omraflow/api

  # Web Frontend (optional - can run locally)
  # web:
  #   build:
  #     context: .
  #     dockerfile: ./docker/Dockerfile.web
  #   container_name: omraflow_web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:5000/api
  #   volumes:
  #     - ./apps/web:/app/apps/web
  #     - ./packages:/app/packages
  #     - /app/node_modules
  #   depends_on:
  #     - api
  #   command: npm run dev --workspace=@omraflow/web

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: omraflow_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
